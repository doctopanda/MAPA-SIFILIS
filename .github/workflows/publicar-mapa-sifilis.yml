name: Publicar MAPA SIFILIS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "mapa-sifilis-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Verificar paquete público
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f data/districts.json
          test -f data/imss_bienestar_regions.json
          test -f data/municipality_region_crosswalk.json
          test -f data/layers_catalog.json
          test -f data/epidemiology_snapshot.json
          if find . -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.csv' -o -iname '*nominal*' -o -iname '*curp*' -o -iname '*paciente*' \) | grep -q .; then
            echo "::error::El repositorio público contiene un archivo potencialmente nominal."
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
